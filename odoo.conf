[options]

; Database
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
dbfilter = .*

; Addons
addons_path = /mnt/extra-addons

; Data directory
data_dir = /var/lib/odoo

; CHANGE THIS PASSWORD
admin_passwd = admin123

; Logging
; logfile = /var/lib/odoo/odoo.log
; log_level = info

; Performance (safe defaults)
workers = 2
max_cron_threads = 1